[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]

[project]
name = "spider_rs"
version = "0.0.54"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
Repository = "https://github.com/spider-rs/spider-py"
Documentation = "https://spider-rs.github.io/spider-py/"
"Hosted API" = "https://spider.cloud/web-scraper/?utm_source=pypi&utm_medium=directory&utm_campaign=spider-py"
